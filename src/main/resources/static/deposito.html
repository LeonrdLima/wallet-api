<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Carteira Digital - Depósito</title>
</head>
<body>
    <h1>Realizar Depósito</h1>

    <div>
        <label for="contaId">ID da Conta:</label>
        <input type="number" id="contaId" placeholder="Ex: 1" required>
    </div>

    <div style="margin-top: 10px;">
        <label for="valor">Valor do Depósito</label>
        <input type="number" id="valor" step="0.01" placeholder="Ex: 150.00" required>
    </div>

    <div style="margin-top: 15px;">
        <button id="btnDepositar" onclick="processarDeposito()">Confirmar Depósito</button>
    </div>

    <div style="margin-top: 20px;">
        <h3>Resultado:</h3>
        <p id="mensagem">Aguardando operação...</p>
    </div>

    
</body>
</html>
